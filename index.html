<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Habit Tracker</title>

<!-- iOS specific PWA tags -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Habits"/>
<meta name="theme-color" content="#7F77DD"/>

<!-- Inline SVG icon as apple-touch-icon -->
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237F77DD'/><text y='.9em' x='50' font-size='58' text-anchor='middle'>✅</text></svg>"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;padding:16px;max-width:680px;margin:0 auto}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none}
input:focus,select:focus,textarea:focus{border-color:#888}
button{font-family:inherit;cursor:pointer}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:14px;margin-bottom:10px}
.metric{background:#f0efe8;border-radius:8px;padding:12px 14px}
.metric .label{font-size:11px;color:#777;margin-bottom:4px}
.metric .val{font-size:22px;font-weight:500}
.tab{padding:6px 14px;border-radius:8px;font-size:13px;border:1px solid #ccc;background:transparent;color:#1a1a1a}
.tab.active{border-color:#7F77DD;background:#efeffd;font-weight:500;color:#7F77DD}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:340px}
.check-btn{width:26px;height:26px;border-radius:50%;border:2px solid #ccc;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.icon-btn{background:transparent;border:none;padding:2px 5px;font-size:15px;color:#888}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.save-btn{background:#7F77DD;border:1px solid #7F77DD;border-radius:8px;padding:8px;font-size:13px;font-weight:500;width:100%;color:#fff}
.cancel-btn{background:transparent;border:1px solid #ccc;border-radius:8px;padding:8px;font-size:13px;width:100%}
.add-btn{background:transparent;border:1px solid #7F77DD;color:#7F77DD;border-radius:8px;padding:6px 14px;font-size:13px}
.install-banner{background:#7F77DD;color:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.install-btn{background:#fff;color:#7F77DD;border:none;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:600;white-space:nowrap}
.close-banner{background:transparent;border:none;color:rgba(255,255,255,0.7);font-size:18px;line-height:1;padding:0 4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

const CATS = ["Health","Work","Personal","Learning","Fitness","Mindfulness"];
const CAT_COLOR = {Health:"#1D9E75",Work:"#378ADD",Personal:"#D4537E",Learning:"#BA7517",Fitness:"#D85A30",Mindfulness:"#7F77DD"};

const todayStr = () => new Date().toISOString().slice(0,10);
const msToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const last30 = () => Array.from({length:30},(_,i)=>new Date(msToday()-(29-i)*86400000).toISOString().slice(0,10));

const DEFAULT = [
  {id:1,name:"Morning run",category:"Fitness",color:"#D85A30",reminder:"07:00",completions:{},notes:{}},
  {id:2,name:"Read 20 pages",category:"Learning",color:"#BA7517",reminder:"21:00",completions:{},notes:{}},
  {id:3,name:"Meditate",category:"Mindfulness",color:"#7F77DD",reminder:"08:00",completions:{},notes:{}},
];

function loadHabits() {
  try { const s=localStorage.getItem("ht2"); return s?JSON.parse(s):DEFAULT; } catch { return DEFAULT; }
}
function saveHabits(h) {
  try { localStorage.setItem("ht2",JSON.stringify(h)); } catch {}
}
function streakOf(c) {
  let s=0,d=new Date(msToday());
  while(true){ const k=d.toISOString().slice(0,10); if(c[k]){s++;d=new Date(d-86400000);}else break; }
  return s;
}
function pctOf(c) {
  return Math.round(last30().filter(d=>c[d]).length/30*100);
}

function App() {
  const [habits,setHabitsRaw] = useState(loadHabits);
  const [view,setView] = useState("today");
  const [modal,setModal] = useState(null);
  const [expanded,setExpanded] = useState(null);
  const [noteVals,setNoteVals] = useState({});
  const [form,setForm] = useState({});
  const [deferredPrompt,setDeferredPrompt] = useState(null);
  const [showBanner,setShowBanner] = useState(false);

  useEffect(()=>{
    // Inject manifest dynamically with purple icon
    const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237F77DD'/><text y='.85em' x='50' font-size='55' text-anchor='middle'>✅</text></svg>`;
    const manifest = {
      name: "My Habit Tracker",
      short_name: "Habits",
      start_url: ".",
      display: "standalone",
      background_color: "#f5f5f0",
      theme_color: "#7F77DD",
      icons: [{
        src: `data:image/svg+xml,${iconSvg}`,
        sizes: "192x192",
        type: "image/svg+xml"
      },{
        src: `data:image/svg+xml,${iconSvg}`,
        sizes: "512x512",
        type: "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = url;
    document.head.appendChild(link);

    const handler = e => {
      e.preventDefault();
      setDeferredPrompt(e);
      setShowBanner(true);
    };
    window.addEventListener("beforeinstallprompt", handler);
    return ()=>window.removeEventListener("beforeinstallprompt", handler);
  },[]);

  function installApp() {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{
      setDeferredPrompt(null);
      setShowBanner(false);
    });
  }

  function setHabits(fn) {
    setHabitsRaw(h => { const next=typeof fn==="function"?fn(h):fn; saveHabits(next); return next; });
  }

  const t = todayStr();
  const dates = last30();

  function toggle(id) {
    setHabits(hs=>hs.map(h=>h.id===id?{...h,completions:{...h.completions,[t]:!h.completions[t]}}:h));
  }
  function saveNote(id) {
    const v=noteVals[id]||"";
    setHabits(hs=>hs.map(h=>h.id===id?{...h,notes:{...h.notes,[t]:v}}:h));
  }
  function delHabit(id) { setHabits(hs=>hs.filter(h=>h.id!==id)); if(expanded===id)setExpanded(null); }
  function openAdd() { setForm({name:"",category:"Health",color:CAT_COLOR["Health"],reminder:"",id:null}); setModal("edit"); }
  function openEdit(h) { setForm({...h}); setModal("edit"); }
  function saveForm() {
    if(!form.name.trim()) return;
    if(form.id) setHabits(hs=>hs.map(h=>h.id===form.id?{...h,...form}:h));
    else setHabits(hs=>[...hs,{...form,id:Date.now(),completions:{},notes:{}}]);
    setModal(null);
  }

  const grouped = CATS.reduce((acc,c)=>{ const hs=habits.filter(h=>h.category===c); if(hs.length)acc[c]=hs; return acc; },{});
  const doneToday = habits.filter(h=>h.completions[t]).length;
  const bestStreak = habits.length ? Math.max(...habits.map(h=>streakOf(h.completions))) : 0;
  const avgPct = habits.length ? Math.round(habits.reduce((a,h)=>a+pctOf(h.completions),0)/habits.length) : 0;
  const dateLabel = new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});

  return (
    <div>
      {showBanner && (
        <div className="install-banner">
          <span>📱 Add Habit Tracker to your Home Screen!</span>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button className="install-btn" onClick={installApp}>Install</button>
            <button className="close-banner" onClick={()=>setShowBanner(false)}>×</button>
          </div>
        </div>
      )}

      <h2 style={{fontWeight:500,fontSize:20,marginBottom:2}}>My habits</h2>
      <p style={{fontSize:13,color:"#777",marginBottom:16}}>{dateLabel}</p>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:20}}>
        {[["Done today",`${doneToday}/${habits.length}`],["Best streak",`${bestStreak}d`],["Monthly avg",`${avgPct}%`]].map(([l,v])=>(
          <div className="metric" key={l}><div className="label">{l}</div><div className="val">{v}</div></div>
        ))}
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
        <button className={`tab${view==="today"?" active":""}`} onClick={()=>setView("today")}>Today</button>
        <button className={`tab${view==="progress"?" active":""}`} onClick={()=>setView("progress")}>Progress</button>
        <button className="add-btn" style={{marginLeft:"auto"}} onClick={openAdd}>+ Add habit</button>
      </div>

      {view==="today" && (
        <div>
          {Object.entries(grouped).map(([cat,hs])=>(
            <div key={cat} style={{marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                <span className="dot" style={{background:CAT_COLOR[cat]}}></span>
                <span style={{fontSize:11,fontWeight:500,color:"#888",textTransform:"uppercase",letterSpacing:"0.05em"}}>{cat}</span>
              </div>
              {hs.map(h=>{
                const done=!!h.completions[t];
                const isOpen=expanded===h.id;
                return (
                  <div className="card" key={h.id}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <button className="check-btn" onClick={()=>toggle(h.id)}
                        style={{borderColor:done?h.color:"#ccc",background:done?h.color:"transparent"}}>
                        {done && <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </button>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:500,fontSize:14,textDecoration:done?"line-through":"none",color:done?"#aaa":"#1a1a1a",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{h.name}</div>
                        <div style={{fontSize:11,color:"#888",marginTop:1}}>
                          {streakOf(h.completions)>0?`🔥 ${streakOf(h.completions)}d · `:""}{pctOf(h.completions)}% this month{h.reminder?` · ⏰ ${h.reminder}`:""}
                        </div>
                      </div>
                      <button className="icon-btn" onClick={()=>setExpanded(isOpen?null:h.id)}>{isOpen?"▲":"▼"}</button>
                      <button className="icon-btn" onClick={()=>openEdit(h)}>✏️</button>
                      <button className="icon-btn" onClick={()=>delHabit(h.id)}>🗑</button>
                    </div>
                    {isOpen && (
                      <div style={{marginTop:10,borderTop:"1px solid #eee",paddingTop:10}}>
                        <div style={{fontSize:12,color:"#888",marginBottom:4}}>Today's note</div>
                        <textarea rows={2} placeholder="How did it go today?"
                          defaultValue={h.notes[t]||""}
                          onChange={e=>setNoteVals(n=>({...n,[h.id]:e.target.value}))}
                          style={{resize:"none",fontSize:13}}/>
                        <button onClick={()=>saveNote(h.id)} style={{
                          marginTop:6,padding:"4px 12px",fontSize:12,border:"1px solid #7F77DD",
                          borderRadius:8,background:"#efeffd",color:"#7F77DD"}}>Save note</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
          {habits.length===0 && <p style={{textAlign:"center",color:"#888",padding:"2rem 0"}}>No habits yet. Hit "+ Add habit" to start.</p>}
        </div>
      )}

      {view==="progress" && (
        <div>
          {habits.map(h=>{
            const done30=dates.filter(d=>h.completions[d]).length;
            const recentNotes=Object.entries(h.notes||{}).filter(([,v])=>v).slice(-3).reverse();
            return (
              <div className="card" key={h.id}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <span className="dot" style={{background:h.color}}></span>
                  <span style={{fontWeight:500,fontSize:14}}>{h.name}</span>
                  <span style={{marginLeft:"auto",fontSize:12,color:"#888"}}>{done30}/30 · {pctOf(h.completions)}%</span>
                </div>
                <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  {dates.map(d=>(
                    <div key={d} title={d} style={{
                      width:18,height:18,borderRadius:3,flexShrink:0,
                      background:h.completions[d]?h.color:"#f0efe8",
                      border:d===t?`2px solid ${h.color}`:"1px solid #e0e0d8",
                      opacity:h.completions[d]?1:0.7
                    }}/>
                  ))}
                </div>
                {recentNotes.length>0 && (
                  <div style={{marginTop:10,borderTop:"1px solid #eee",paddingTop:8}}>
                    <div style={{fontSize:11,color:"#888",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"}}>Recent notes</div>
                    {recentNotes.map(([date,note])=>(
                      <div key={date} style={{fontSize:12,marginBottom:3}}>
                        <span style={{color:"#aaa"}}>{date}: </span>{note}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
          {habits.length===0 && <p style={{textAlign:"center",color:"#888",padding:"2rem 0"}}>No habits to track yet.</p>}
        </div>
      )}

      {modal==="edit" && (
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)setModal(null)}}>
          <div className="modal">
            <div style={{fontWeight:500,fontSize:16,marginBottom:14}}>{form.id?"Edit habit":"New habit"}</div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:12,color:"#888",marginBottom:4}}>Name</div>
              <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Morning yoga"/>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:12,color:"#888",marginBottom:4}}>Category</div>
              <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value,color:CAT_COLOR[e.target.value]}))}>
                {CATS.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:12,color:"#888",marginBottom:4}}>Reminder time (optional)</div>
              <input type="time" value={form.reminder} onChange={e=>setForm(f=>({...f,reminder:e.target.value}))}/>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="cancel-btn" onClick={()=>setModal(null)}>Cancel</button>
              <button className="save-btn" onClick={saveForm}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if('serviceWorker' in navigator){
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(()=>new Response('Offline'))));
  `;
  const blob = new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
